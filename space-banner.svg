<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Kawthar Khayet: Data Science and AI Engineer. Enter my personal space.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090818"/><stop offset=".55" stop-color="#171236"/><stop offset="1" stop-color="#2a1250"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a5b4fc"/><stop offset=".5" stop-color="#f0abfc"/><stop offset="1" stop-color="#67e8f9"/>
  </linearGradient>
  <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <radialGradient id="planet" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#f9a8d4"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#3b0764"/>
  </radialGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="frame"><rect width="1000" height="340" rx="22"/></clipPath>
</defs>
<style>
  text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .tw { fill: #fff; animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  .neb { animation: drift 16s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .neb.b { animation-delay: -5s; } .neb.c { animation-delay: -10s; }
  @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,-25px) scale(1.15); } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .orbit { animation: spin 9s linear infinite; transform-origin: 830px 150px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .shoot { animation: shoot 7s ease-in infinite; opacity: 0; }
  @keyframes shoot { 0% { transform: translate(0,0); opacity: 0; } 2% { opacity: 1; } 12% { transform: translate(-360px,180px); opacity: 0; } 100% { opacity: 0; } }
  .up { animation: up 1s ease-out both; }
  .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  .line { opacity: 0; animation: cycle 9s infinite; }
  .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; }
  @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 5%,28% { opacity: 1; transform: none; } 33%,100% { opacity: 0; transform: translateY(-8px); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  .arrow { animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
  .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1000" height="340" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".75">
    <circle class="neb" cx="760" cy="80" r="130" fill="#7c3aed"/>
    <circle class="neb b" cx="560" cy="330" r="120" fill="#db2777"/>
    <circle class="neb c" cx="120" cy="60" r="110" fill="#0891b2"/>
  </g>
  <g><circle class="tw" cx="0.1" cy="313.1" r="1.00" style="animation-delay:-0.84s;animation-duration:4.69s"/><circle class="tw" cx="532.7" cy="112.0" r="1.65" style="animation-delay:-3.02s;animation-duration:4.13s"/><circle class="tw" cx="684.5" cy="216.2" r="1.74" style="animation-delay:-0.97s;animation-duration:3.62s"/><circle class="tw" cx="707.9" cy="237.3" r="0.68" style="animation-delay:-2.74s;animation-duration:3.90s"/><circle class="tw" cx="922.4" cy="274.5" r="0.77" style="animation-delay:-2.05s;animation-duration:5.27s"/><circle class="tw" cx="688.5" cy="218.9" r="1.41" style="animation-delay:-3.65s;animation-duration:5.23s"/><circle class="tw" cx="372.2" cy="114.0" r="1.77" style="animation-delay:-1.33s;animation-duration:2.96s"/><circle class="tw" cx="297.6" cy="145.7" r="1.01" style="animation-delay:-3.75s;animation-duration:4.17s"/><circle class="tw" cx="729.3" cy="298.5" r="0.68" style="animation-delay:-1.09s;animation-duration:4.18s"/><circle class="tw" cx="508.8" cy="143.3" r="0.87" style="animation-delay:-3.64s;animation-duration:2.66s"/><circle class="tw" cx="365.5" cy="117.0" r="1.53" style="animation-delay:-3.70s;animation-duration:4.04s"/><circle class="tw" cx="165.6" cy="137.9" r="1.00" style="animation-delay:-1.46s;animation-duration:3.77s"/><circle class="tw" cx="332.6" cy="180.8" r="1.46" style="animation-delay:-0.93s;animation-duration:5.22s"/><circle class="tw" cx="457.8" cy="293.4" r="1.49" style="animation-delay:-2.54s;animation-duration:4.05s"/><circle class="tw" cx="504.9" cy="234.3" r="1.92" style="animation-delay:-1.59s;animation-duration:4.62s"/><circle class="tw" cx="251.1" cy="199.5" r="1.09" style="animation-delay:-1.32s;animation-duration:3.67s"/><circle class="tw" cx="794.7" cy="298.4" r="0.76" style="animation-delay:-3.28s;animation-duration:2.73s"/><circle class="tw" cx="406.8" cy="52.2" r="0.71" style="animation-delay:-3.98s;animation-duration:3.16s"/><circle class="tw" cx="632.4" cy="49.0" r="1.24" style="animation-delay: