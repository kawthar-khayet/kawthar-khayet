1" style="animation-delay:-3.00s;animation-duration:2.58s"/><circle class="tw" cx="298.8" cy="184.2" r="0.88" style="animation-delay:-2.89s;animation-duration:3.37s"/><circle class="tw" cx="235.7" cy="224.3" r="1.20" style="animation-delay:-0.30s;animation-duration:4.82s"/><circle class="tw" cx="822.9" cy="311.3" r="1.87" style="animation-delay:-2.72s;animation-duration:5.38s"/><circle class="tw" cx="25.2" cy="259.1" r="1.44" style="animation-delay:-2.90s;animation-duration:5.19s"/><circle class="tw" cx="37.0" cy="46.2" r="0.71" style="animation-delay:-0.43s;animation-duration:2.75s"/><circle class="tw" cx="9.5" cy="205.7" r="1.92" style="animation-delay:-0.77s;animation-duration:2.90s"/><circle class="tw" cx="202.2" cy="229.5" r="0.94" style="animation-delay:-1.83s;animation-duration:5.48s"/><circle class="tw" cx="422.6" cy="229.1" r="1.68" style="animation-delay:-1.59s;animation-duration:3.75s"/><circle class="tw" cx="61.2" cy="78.2" r="1.73" style="animation-delay:-3.90s;animation-duration:2.96s"/><circle class="tw" cx="925.5" cy="173.0" r="0.77" style="animation-delay:-0.84s;animation-duration:4.31s"/><circle class="tw" cx="170.5" cy="26.5" r="0.98" style="animation-delay:-2.59s;animation-duration:4.17s"/><circle class="tw" cx="480.6" cy="337.9" r="0.71" style="animation-delay:-1.65s;animation-duration:3.44s"/><circle class="tw" cx="4.2" cy="2.1" r="1.18" style="animation-delay:-0.37s;animation-duration:3.20s"/><circle class="tw" cx="924.1" cy="264.3" r="1.67" style="animation-delay:-1.75s;animation-duration:5.06s"/><circle class="tw" cx="962.4" cy="272.3" r="1.53" style="animation-delay:-2.29s;animation-duration:3.54s"/><circle class="tw" cx="407.0" cy="169.0" r="1.29" style="animation-delay:-2.27s;animation-duration:4.67s"/><circle class="tw" cx="665.1" cy="215.2" r="1.62" style="animation-delay:-3.54s;animation-duration:5.04s"/><circle class="tw" cx="988.2" cy="148.9" r="1.28" style="animation-delay:-3.83s;animation-duration:5.43s"/><circle class="tw" cx="357.8" cy="26.9" r="1.08" style="animation-delay:-3.53s;animation-duration:4.63s"/><circle class="tw" cx="738.1" cy="324.8" r="1.70" style="animation-delay:-0.83s;animation-duration:3.21s"/><circle class="tw" cx="798.5" cy="35.4" r="1.88" style="animation-delay:-3.20s;animation-duration:4.41s"/><circle class="tw" cx="711.5" cy="182.2" r="1.22" style="animation-delay:-3.49s;animation-duration:4.19s"/><circle class="tw" cx="873.7" cy="92.0" r="1.56" style="animation-delay:-1.74s;animation-duration:3.69s"/><circle class="tw" cx="187.5" cy="200.3" r="0.92" style="animation-delay:-3.60s;animation-duration:4.97s"/><circle class="tw" cx="338.0" cy="232.2" r="1.83" style="animation-delay:-0.46s;animation-duration:3.42s"/><circle class="tw" cx="920.9" cy="0.4" r="0.78" style="animation-delay:-1.59s;animation-duration:2.56s"/><circle class="tw" cx="692.9" cy="305.3" r="0.84" style="animation-delay:-0.85s;animation-duration:5.34s"/><circle class="tw" cx="699.8" cy="59.6" r="0.76" style="animation-delay:-2.51s;animation-duration:2.55s"/><circle class="tw" cx="811.9" cy="201.1" r="1.65" style="animation-delay:-0.51s;animation-duration:3.49s"/><circle class="tw" cx="714.8" cy="324.7" r="1.37" style="animation-delay:-2.35s;animation-duration:4.83s"/><circle class="tw" cx="702.5" cy="249.4" r="1.44" style="animation-delay:-0.40s;animation-duration:2.64s"/><circle class="tw" cx="613.3" cy="76.5" r="1.41" style="animation-delay:-1.00s;animation-duration:3.17s"/></g>

  <!-- shooting star -->
  <g class="shoot"><line x1="900" y1="20" x2="990" y2="-25" stroke="url(#trail)" stroke-width="2" stroke-linecap="round" transform="rotate(180 945 0)"/></g>

  <!-- planet, ring and orbiting moon -->
  <g class="float">
    <g transform="rotate(-18 830 150)">
      <ellipse cx="830" cy="150" rx="118" ry="26" fill="none" stroke="#c4b5fd" stroke-opacity=".35" stroke-width="2.5"/>
      <circle cx="830" cy="150" r="62" fill="url(#planet)"/>
      <path d="M 712 150 A 118 26 0 0 0 948 150" fill="none" stroke="#e9d5ff" stroke-opacity=".8" stroke-width="3"/>
    </g>
    <g class="orbit"><circle cx="830" cy="58" r="7" fill="#67e8f9"/><circle cx="830" cy="58" r="14" fill="#67e8f9" opacity=".2"/></g>
  </g>

  <!-- text -->
  <text class="up" x="64" y="92" font-size="20" fill="#c7d2fe" letter-spacing="4">HI, I'M</text>
  <text class="up d1" x="60" y="160" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1">Kawthar Khayet</text>
  <g font-size="24" fill="#e0e7ff" font-weight="500">
    <text class="line l1" x="64" y="205">Data Science &amp; AI Engineering student · INPT</text>
    <text class="line l2" x="64" y="205">LLM agents · RAG · Data pipelines · Deep learning</text>
    <text class="line l3" x="64" y="205">Welcome to my personal space ✦</text>
  </g>

  <!-- call to action -->
  <g class="up d2">
    <rect class="pulse" x="58" y="236" width="330" height="58" rx="29" fill="url(#btn)" filter="url(#glow)"/>
    <rect x="64" y="240" width="318" height="50" rx="25" fill="url(#btn)"/>
    <text x="92" y="272" font-size="19" font-weight="700" fill="#fff">Enter my personal space</text>
    <g class="arrow"><text x="336" y="273" font-size="22" font-weight="700" fill="#fff">→</text></g>
  </g>
  <circle class="dot" cx="420" cy="265" r="6" fill="#4ade80"/>
  <text x="434" y="271" font-size="16" fill="#bbf7d0">Open to a PFE internship</text>
</g>
</svg>
