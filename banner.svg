<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Kawthar Khayet — Data Engineering and AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9B8AFB"/>
      <stop offset="35%"  stop-color="#C5A7F7"/>
      <stop offset="65%"  stop-color="#F5B7D6"/>
      <stop offset="100%" stop-color="#9DD8F2"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#C5A7F7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#C5A7F7" stroke-width="0.5" opacity="0.07"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .name {
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 46px; font-weight: 700; letter-spacing: 3px; fill: #ffffff;
        opacity: 0; animation: rise 1.1s cubic-bezier(.2,.7,.3,1) .1s forwards;
      }
      .tag {
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 14px; font-weight: 500; letter-spacing: 4.5px; fill: #C5A7F7;
        opacity: 0; animation: rise 1.1s cubic-bezier(.2,.7,.3,1) .45s forwards;
      }
      .stage {
        font-family: "Fira Code", "SFMono-Regular", Consolas, monospace;
        font-size: 11px; letter-spacing: 1.6px; fill: #8b93a7;
        opacity: 0; animation: fade 1s ease-out 1.1s forwards;
      }
      .line { opacity: 0; animation: draw 1.4s ease-out .8s forwards; }
      .node { opacity: 0; animation: pop .5s cubic-bezier(.2,1.3,.4,1) forwards; }
      .flow { animation: travel 3.6s cubic-bezier(.55,0,.45,1) infinite; }

      @keyframes rise   { from { opacity:0; transform: translateY(12px);} to { opacity:1; transform: translateY(0);} }
      @keyframes fade   { to { opacity: 1; } }
      @keyframes pop    { from { opacity:0; transform: scale(.2);} to { opacity:1; transform: scale(1);} }
      @keyframes draw   { from { opacity:0; stroke-dasharray: 0 660;} to { opacity:1; stroke-dasharray: 660 0;} }
      @keyframes travel { 0% { transform: translateX(0); opacity:0; } 12% { opacity:1; } 88% { opacity:1; } 100% { transform: translateX(640px); opacity:0; } }

      @media (prefers-reduced-motion: reduce) {
        .name, .tag, .stage, .line, .node { opacity: 1; animation: none; }
        .flow { display: none; }
      }
    </style>
  </defs>

  <rect width="1000" height="220" fill="#0d1117"/>
  <rect width="1000" height="220" fill="url(#grid)"/>
  <rect width="1000" height="220" fill="url(#halo)"/>

  <text class="name" x="500" y="82"  text-anchor="middle">Kawthar Khayet</text>
  <text class="tag"  x="500" y="112" text-anchor="middle">DATA ENGINEERING &amp; AI · INPT RABAT</text>

  <line class="line" x1="180" y1="170" x2="820" y2="170"
        stroke="url(#pipe)" stroke-width="2" stroke-linecap="round"/>

  <g class="node" style="animation-delay:1.05s; transform-origin:180px 170px">
    <circle cx="180" cy="170" r="6" fill="#9B8AFB"/>
  </g>
  <g class="node" style="animation-delay:1.25s; transform-origin:393px 170px">
    <circle cx="393" cy="170" r="6" fill="#C5A7F7"/>
  </g>
  <g class="node" style="animation-delay:1.45s; transform-origin:607px 170px">
    <circle cx="607" cy="170" r="6" fill="#F5B7D6"/>
  </g>
  <g class="node" style="animation-delay:1.65s; transform-origin:820px 170px">
    <circle cx="820" cy="170" r="6" fill="#9DD8F2"/>
  </g>

  <g filter="url(#soft)">
    <circle class="flow" cx="180" cy="170" r="3.6" fill="#ffffff" style="animation-delay:0s"/>
    <circle class="flow" cx="180" cy="170" r="3.2" fill="#F5B7D6" style="animation-delay:.9s"/>
    <circle class="flow" cx="180" cy="170" r="3.2" fill="#C5A7F7" style="animation-delay:1.8s"/>
    <circle class="flow" cx="180" cy="170" r="3.0" fill="#9DD8F2" style="animation-delay:2.7s"/>
  </g>

  <text class="stage" x="180" y="196" text-anchor="middle">INGEST</text>
  <text class="stage" x="393" y="196" text-anchor="middle">PROCESS</text>
  <text class="stage" x="607" y="196" text-anchor="middle">STORE</text>
  <text class="stage" x="820" y="196" text-anchor="middle">SERVE</text>
</svg>
